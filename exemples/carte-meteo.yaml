# Carte Météo : toutes les options (aucune n'est obligatoire)
type: custom:meteo-card
title: Météo
entity: weather.ma_ville            # vide : Météo-France, sinon la première entité weather
alert: sensor.00_weather_alert      # vide : vigilance Météo-France détectée
# Plusieurs villes en onglets (remplace « entity ») :
# entities:
#   - entity: weather.ma_ville
#     name: Ma ville
#     alert: sensor.00_weather_alert
#   - entity: weather.station_de_ski
#     name: Station de ski
#     alert: sensor.99_weather_alert
forecasts: [hourly, daily]          # hourly, daily, twice_daily (l'un sous l'autre)
hours: 8                            # nombre d'heures
days: 7                             # nombre de jours
season: sensor.saison               # vide : détectée, sinon calculée d'après la date
moon: sensor.moon_phase             # vide : détectée, sinon calculée
zodiac: sensor.zodiac               # vide : détecté
show_stats: true                    # ressenti, vent, humidité, pression
show_details: true                  # nuages, pluie, gel, neige, UV (capteurs Météo-France)
show_alert: true
show_forecast: true
show_sky: true                      # saison, lune, zodiaque
theme: v2                           # v2, auto ou ha
