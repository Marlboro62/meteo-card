<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartes Météo — démo</title>
<style>
:root { color-scheme: dark; }
body { margin: 0; padding: 24px 16px; background: #111823; font-family: Roboto, "Segoe UI", system-ui, sans-serif; color: #e7edf5; }
body.light { background: #eef2f7; color: #1a2434; color-scheme: light; }
h1 { font-size: 1.2rem; margin: 0 0 4px; }
p.note { margin: 0 0 14px; font-size: .85rem; opacity: .75; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; font-size: 14px; margin-bottom: 16px; }
button { padding: 6px 12px; border-radius: 8px; border: 1px solid #2f3d55; background: #212d40; color: inherit; cursor: pointer; font: inherit; }
button.on { border-color: #1d93e3; box-shadow: inset 0 -2px 0 #1d93e3; }
body.light button { background: #fff; border-color: #dbe2ec; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; align-items: start; max-width: 1400px; margin: 0 auto; }
body.phone .grid { grid-template-columns: 380px; justify-content: center; }
</style></head>
<body>
<div style="max-width:1400px;margin:0 auto">
  <h1>Cartes Météo</h1>
  <p class="note">La vraie carte avec des données fictives (villes et capteurs inventés). Cliquez sur la lune pour ouvrir les phases.</p>
  <div class="bar">
    <button data-theme="v2" class="on">Bleu nuit</button><button data-theme="auto-light">Clair</button><button data-theme="ha">Thème HA</button>
    <button data-act="pluie" class="on">Pluie et vigilance</button><button data-act="soleil">Beau temps</button>
    <button data-act="phone">Téléphone</button><button data-act="windy">Carte Windy</button><button data-act="photos">Photos lune et Terre</button>
  </div>
</div>
<div class="grid" id="host"></div>
<script>
// Home Assistant fournit <ha-card> et <ha-icon> ; ici, <ha-icon> affiche les icônes Material Design Icons.
if (!customElements.get("ha-card")) customElements.define("ha-card", class extends HTMLElement {});
if (!customElements.get("ha-icon")) customElements.define("ha-icon", class extends HTMLElement {
  static get observedAttributes() { return ["icon"]; }
  connectedCallback() { this._draw(); }
  attributeChangedCallback() { this._draw(); }
  _draw() {
    const name = (this.getAttribute("icon") || "").replace(/^mdi:/, "");
    if (!name) return;
    const url = `https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/${name}.svg`;
    this.style.cssText += `;display:inline-block;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);flex:none;` +
      `background:currentColor;-webkit-mask:url(${url}) center/contain no-repeat;mask:url(${url}) center/contain no-repeat;`;
  }
});
</script>
<script src="../meteo-card.js"></script>
<script>
// Données fictives : aucune donnée réelle (villes, capteurs et coordonnées inventés)
const DAY = 86400e3, HOUR = 3600e3;
const mk = (conds, base) => conds.map((c, i) => ({ datetime: new Date(Date.now() + i * DAY).toISOString(), condition: c,
  temperature: base[i][0], templow: base[i][1], precipitation_probability: base[i][2], precipitation: base[i][3] }));
const SCEN = {
  pluie: { state: "rainy", attrs: { temperature: 13.6, apparent_temperature: 11.2, humidity: 90, pressure: 996.4, wind_speed: 32.4, wind_gust_speed: 64.8, wind_bearing: 250 },
    alert: { state: "Jaune", attrs: { "Vent violent": "Jaune", "Pluie-inondation": "Jaune", "Orages": "Vert", "Inondation": "Vert", "Neige-verglas": "Vert" } },
    mf: { cloud_cover: 90, rain_chance: 80, freeze_chance: 0, snow_chance: 0, uv: 1, daily_precipitation: 12.4 },
    pollen: { state: "faible", risk: 1, plants: { "Graminées": "faible", "Urticacées": "faible", "Ambroisies": "nul", "Chêne": "nul" } },
    fc: mk(["rainy", "pouring", "cloudy", "partlycloudy", "sunny", "partlycloudy", "rainy"], [[15, 9, 90, 8.2], [14, 8, 100, 15.1], [16, 8, 30, 0.4], [17, 7, 10, 0], [18, 6, 0, 0], [17, 8, 20, 0], [14, 9, 70, 3.2]]) },
  soleil: { state: "partlycloudy", attrs: { temperature: 27.4, humidity: 55, pressure: 1013.8, wind_speed: 18, wind_gust_speed: 32, wind_bearing: 290 },
    alert: { state: "Vert", attrs: { "Vent violent": "Vert", "Orages": "Vert", "Canicule": "Vert" } },
    mf: { cloud_cover: 40, rain_chance: 10, freeze_chance: 0, snow_chance: 0, uv: 8, daily_precipitation: 3.6 },
    pollen: { state: "élevé", risk: 3, plants: { "Graminées": "élevé", "Chêne": "faible", "Olivier": "faible", "Oseille": "faible", "Plantain": "faible", "Urticacées": "moyen", "Ambroisies": "nul" } },
    fc: mk(["sunny", "sunny", "partlycloudy", "lightning-rainy", "sunny", "sunny", "cloudy"], [[28, 17, 0, 0], [30, 15, 0, 0], [31, 17, 10, 0], [29, 19, 80, 2.2], [31, 18, 0, 0], [31, 19, 0, 0], [32, 19, 20, 0.8]]) },
};
let scen = "pluie", windy = false, photos = false, theme = "v2";
// photos facultatives (options moon_image et earth_image), fournies dans le dossier photos/ du dépôt
const PHOTOS = () => (photos ? { moon_image: "../photos/lune.svg", earth_image: "../photos/terre.svg" } : {});
const listeners = [];
function hassFor() {
  const s = SCEN[scen];
  const states = {}, entities = {};
  const add = (id, state, attributes = {}, platform) => { states[id] = { entity_id: id, state: String(state), attributes, last_updated: `${scen}${id}` }; if (platform) entities[id] = { platform, device_id: platform === "meteo_france" ? "dev_ville" : undefined }; };
  add("weather.ville_exemple", s.state, { ...s.attrs, temperature_unit: "°C", pressure_unit: "hPa", wind_speed_unit: "km/h", friendly_name: "Ville-Exemple" }, "meteo_france");
  add("weather.station_montagne", scen === "pluie" ? "snowy" : "sunny", { temperature: scen === "pluie" ? -1.5 : 12.3, humidity: 70, pressure: 1004, wind_speed: 22, wind_bearing: 200, temperature_unit: "°C", pressure_unit: "hPa", wind_speed_unit: "km/h", friendly_name: "Station-Montagne" });
  for (const [k, v] of Object.entries(s.mf)) add(`sensor.ville_exemple_${k}`, v, {}, "meteo_france");
  add("sensor.00_weather_alert", s.alert.state, s.alert.attrs, "meteo_france");
  add("sensor.saison", scen === "pluie" ? "autumn" : "spring", { options: ["spring", "summer", "autumn", "winter"] });
  add("sensor.zodiac", "scorpio", { options: ["aries", "taurus", "gemini", "cancer", "leo", "virgo", "libra", "scorpio", "sagittarius", "capricorn", "aquarius", "pisces"] });
  add("sun.sun", "above_horizon", { friendly_name: "Soleil" });
  add("sensor.pollens_00", s.pollen.state, { friendly_name: "Pollens Département-Exemple" });
  add("sensor.pollens_00_risklevel", s.pollen.risk, {});
  for (const [name, lv] of Object.entries(s.pollen.plants)) add(`sensor.pollens_00_${name.normalize("NFD").replace(/[^\w]/g, "").toLowerCase()}`, lv, { pollen_name: name });
  // pluie dans l'heure (Météo-France), qualité de l'air et pollens (Atmo France), sécheresse (VigiEau), éclairs (Blitzortung)
  const ref = new Date(Math.floor(Date.now() / 3e5) * 3e5);
  const rainy = scen === "pluie";
  add("sensor.ville_exemple_next_rain", rainy ? new Date(ref.getTime() + 15 * 6e4).toISOString() : "unknown", { forecast_time_ref: ref.toISOString(),
    "1_hour_forecast": Object.fromEntries([0, 5, 10, 15, 20, 25, 35, 45, 55].map((m) => [`${m} min`, !rainy ? "Temps sec" : m < 15 ? "Temps sec" : m < 25 ? "Pluie faible" : m < 45 ? "Pluie modérée" : "Pluie forte"])) }, "meteo_france");
  const atmo = (id, lv, extra = {}) => add(id, lv, { "Libellé": undefined, ...extra }, "atmofrance");
  // capteurs du lendemain (« -J+1 ») créés par Atmo France : la carte doit les ignorer
  atmo("sensor.dioxyde_d_azote_ville_exemple_j_1", 5, { friendly_name: "Dioxyde d'azote-Ville-Exemple-J+1" });
  atmo("sensor.niveau_ambroisie_ville_exemple_j_1", 6, { friendly_name: "Niveau Ambroisie-Ville-Exemple-J+1" });
  atmo("sensor.qualite_globale_ville_exemple", rainy ? 1 : 2);
  atmo("sensor.dioxyde_d_azote_ville_exemple", 1); atmo("sensor.dioxyde_de_soufre_ville_exemple", 1);
  atmo("sensor.ozone_ville_exemple", rainy ? 1 : 2); atmo("sensor.pm10_ville_exemple", rainy ? 1 : 3); atmo("sensor.pm25_ville_exemple", 1);
  atmo("sensor.qualite_globale_pollen_ville_exemple", rainy ? 1 : 4);
  for (const [k, lv, cv] of [["ambroisie", 1, 0], ["armoise", 1, 0], ["aulne", 1, 0], ["bouleau", rainy ? 1 : 2, rainy ? 0 : 3.2], ["gramine", rainy ? 1 : 4, rainy ? 0 : 41.5], ["olivier", rainy ? 1 : 3, rainy ? 0 : 12]]) {
    atmo(`sensor.niveau_${k}_ville_exemple`, lv);
    add(`sensor.${k}_ville_exemple`, cv, { unit_of_measurement: "µg/m³" }, "atmofrance");
  }
  // VigiEau : un niveau par type d'eau (eau potable, souterraines, superficielles) et des usages autorisés ou non
  for (const [t, lvl] of [["aep", rainy ? "Vigilance" : "Alerte renforcée"], ["sou", rainy ? "Vigilance" : "Crise"], ["sup", rainy ? "Vigilance" : "Alerte"]]) {
    add(`sensor.vigieau_ville_exemple_${t}_niveau_d_alerte_a_ville_exemple`, lvl, {}, "vigieau");
    add(`sensor.vigieau_ville_exemple_${t}_niveau_d_alerte_a_ville_exemple_numerique`, ["Vigilance", "Alerte", "Alerte renforcée", "Crise"].indexOf(lvl) + 1, {}, "vigieau");
  }
  for (const [u, off] of [["Lavage des véhicules", true], ["Arrosage des pelouses", !rainy], ["Vidange et remplissage des piscines", !rainy]])
    add(`binary_sensor.vigieau_ville_exemple_aep_${u.normalize("NFD").replace(/[^\w ]/g, "").replace(/ /g, "_").toLowerCase()}`, off ? "off" : "on",
      { friendly_name: `Vigieau Ville-Exemple AEP ${u} autorisé à Ville-Exemple` }, "vigieau");
  // Blitzortung (Home Assistant en français : noms traduits)
  add("sensor.maison_compteur_de_foudre", rainy ? 12 : 0, { unit_of_measurement: "↯" }, "blitzortung");
  add("sensor.maison_distance_de_foudre", rainy ? 18.4 : "unknown", { unit_of_measurement: "km" }, "blitzortung");
  add("sensor.maison_azimut_de_foudre", rainy ? 248 : "unknown", { unit_of_measurement: "°" }, "blitzortung");
  add("sensor.eclairs_du_mois", rainy ? 63 : 41, {});
  // Bolides : même format que l'API Fireball de la NASA (capteur REST), positions et dates tirées au hasard (fictives)
  add("sensor.bolides_nasa", FIREBALLS.length, { fields: ["date", "energy", "impact-e", "lat", "lat-dir", "lon", "lon-dir", "alt", "vel"], data: FIREBALLS, friendly_name: "Bolides NASA" });
  add("sensor.salon_temperature", 21.4, { friendly_name: "Salon" });
  add("sensor.salon_humidity", 52, {});
  add("sensor.jardin_temperature", s.attrs.temperature - 0.6, { friendly_name: "Jardin" });
  add("sensor.jardin_humidity", s.attrs.humidity - 4, {});
  // Environnement Canada (lieu fictif) : météo et 5 capteurs d'alertes sur le même appareil, noms en français
  add("weather.ville_erable", rainy ? "windy" : "sunny", { temperature: rainy ? 4.2 : 16.8, humidity: 76, pressure: 1001, wind_speed: rainy ? 54 : 12, wind_gust_speed: rainy ? 90 : 20, wind_bearing: 270, temperature_unit: "°C", pressure_unit: "hPa", wind_speed_unit: "km/h", friendly_name: "Ville-Érable" });
  entities["weather.ville_erable"] = { platform: "environment_canada", device_id: "dev_ec" };
  const ec = EC_ALERTS();
  for (const [k, fr] of [["warnings", "alertes"], ["watches", "veilles"], ["advisories", "avis"], ["statements", "bulletins"], ["endings", "terminaisons"]]) {
    const id = `sensor.ville_erable_${fr}`, list = ec[k];
    const attrs = { location: "Ville-Érable", station: "Station-Exemple" };
    list.forEach((a, i) => { attrs[`alert_${i + 1}`] = a.title; attrs[`alert_time_${i + 1}`] = a.date; });
    add(id, list.length, list.length ? attrs : {});
    entities[id] = { platform: "environment_canada", device_id: "dev_ec", translation_key: k };
  }
  return {
    themes: { darkMode: !document.body.classList.contains("light") },
    config: { latitude: 46.6, longitude: 2.4 }, // centre de la France, fictif
    states, entities,
    // action environment_canada.get_alerts (réponse avec la couleur et l'heure de fin)
    callWS: async (m) => m.type === "config/entity_registry/get" ? { entity_id: m.entity_id, config_entry_id: "entree_exemple" }
      : m.type === "call_service" && m.service === "get_alerts" ? { context: {}, response: EC_ALERTS() } : null,
    connection: { subscribeMessage(cb, msg) {
      const send = () => {
        const sc = SCEN[scen], mount = msg.entity_id === "weather.station_montagne";
        const fc = msg.forecast_type === "hourly"
          ? Array.from({ length: 24 }, (_, i) => ({ datetime: new Date(Math.ceil(Date.now() / HOUR) * HOUR + i * HOUR).toISOString(),
            condition: i > 3 && new Date(Date.now() + i * HOUR).getHours() >= 21 ? "clear-night" : sc.fc[0].condition,
            temperature: (mount ? sc.attrs.temperature - 14 : sc.attrs.temperature) - i * 0.4 + Math.sin(i / 3), precipitation: i < 3 && scen === "pluie" ? 1.2 - i * 0.4 : 0,
            precipitation_probability: sc.fc[0].precipitation_probability, wind_speed: i < 2 ? 0 : sc.attrs.wind_speed + (i % 3) * 2, wind_gust_speed: sc.attrs.wind_gust_speed - i * 2, humidity: Math.min(98, sc.attrs.humidity + i * 2), wind_bearing: sc.attrs.wind_bearing + i * 3 }))
          : sc.fc.map((d) => mount ? { ...d, temperature: d.temperature - 14, templow: d.templow - 12, condition: d.condition === "rainy" ? "snowy" : d.condition } : d);
        cb({ type: msg.forecast_type, forecast: fc });
      };
      listeners.push(send); setTimeout(send, 30);
      return Promise.resolve(() => listeners.splice(listeners.indexOf(send), 1));
    } },
  };
}
const host = document.getElementById("host");
// alertes Environnement Canada fictives (même format que l'action environment_canada.get_alerts)
function EC_ALERTS() {
  const t = (h) => new Date(Math.floor(Date.now() / HOUR) * HOUR + h * HOUR).toISOString();
  if (scen !== "pluie") return { warnings: [], watches: [], advisories: [], statements: [], endings: [{ title: "Avertissement de vent terminé", date: t(-30) }] };
  return {
    warnings: [{ title: "Avertissement de vent en vigueur", date: t(-2), alert_colour_level: "orange", expiry_time: t(9) }],
    watches: [{ title: "Veille d'orages violents en vigueur", date: t(-1), alert_colour_level: "yellow", expiry_time: t(5) }],
    advisories: [],
    statements: [{ title: "Bulletin météorologique spécial en vigueur", date: t(-5) }],
    endings: [],
  };
}
// bolides fictifs (générateur pseudo-aléatoire fixe : la démo affiche toujours les mêmes)
const FIREBALLS = (() => {
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const row = (t, lat, lon, e, kt, alt, vel) => [new Date(t).toISOString().slice(0, 19).replace("T", " "), e.toFixed(1), kt.toFixed(kt < 1 ? 3 : 1),
    Math.abs(lat).toFixed(1), lat < 0 ? "S" : "N", Math.abs(lon).toFixed(1), lon < 0 ? "W" : "E", alt.toFixed(1), vel.toFixed(1)];
  const out = [row(Date.now() - 4.3 * DAY, 46.4, -6.8, 6.2, 0.24, 31.5, 17.9), row(Date.now() - 41 * DAY, 38.2, 21.5, 14.8, 0.5, 28, 22.4),
    row(Date.UTC(2013, 1, 15, 3, 20, 33), 54.8, 61.1, 375000, 440, 23.3, 18.6)];
  for (let i = 0; i < 180; i++) {
    const e = 2 + 400 * rnd() ** 6, kt = 0.07 + 0.11 * e ** 0.9 / 10;
    out.push(row(Date.now() - (60 + rnd() * 4700) * DAY, (rnd() * 2 - 1) * 70, (rnd() * 2 - 1) * 180, e, kt, 20 + rnd() * 25, 11 + rnd() * 25));
  }
  return out.sort((a, b) => (a[0] < b[0] ? 1 : -1));
})();
// Flux publics simulés (NOAA, USGS, EMSC) : la démo ne contacte aucun service
const QUAKES = (() => {
  // séismes inventés autour du centre de la France et dans le monde
  const near = [[45.9, 6.6, 3.1, 0.2, "Alpes françaises", 8], [43.1, -0.4, 2.6, 0.9, "Pyrénées", 11], [44.3, 7.1, 2.2, 1.6, "Alpes-Maritimes", 6],
    [47.6, 7.5, 3.4, 2.8, "Suisse", 14], [41.9, 13.4, 4.2, 3.4, "Italie centrale", 10], [45.2, 1.9, 2.1, 4.2, "Massif central", 5], [48.4, -4.6, 2.4, 5.6, "Bretagne", 9]];
  const world = [[-21.6, -174.8, 6.4, 1.2, "Îles Tonga", 35], [38.3, 142.4, 6.1, 4.1, "Japon, côte de Honshu", 40]];
  return [...near, ...world].map(([lat, lon, mag, d, place, depth], i) => ({ type: "Feature", id: `demo${i}`,
    properties: { mag, place, time: Date.now() - d * DAY, url: "" }, geometry: { type: "Point", coordinates: [lon, lat, depth] } }));
})();
const KP_NOW = () => (scen === "soleil" ? 6.33 : 2.67);
const realFetch = window.fetch.bind(window);
window.fetch = (url, ...rest) => {
  const u = String(url), json = (j) => Promise.resolve(new Response(JSON.stringify(j), { headers: { "content-type": "application/json" } }));
  const tag = (ms) => new Date(Date.now() + ms).toISOString().slice(0, 19).replace("T", " ");
  if (u.includes("noaa-planetary-k-index-forecast")) return json([["time_tag", "kp", "observed", "noaa_scale"],
    ...Array.from({ length: 24 }, (_, i) => [tag(i * 3 * HOUR - 6 * HOUR), (KP_NOW() + Math.sin(i / 2.5) * 1.6).toFixed(2), i < 2 ? "observed" : "predicted", null])]);
  if (u.includes("noaa-planetary-k-index")) return json([["time_tag", "Kp", "a_running", "station_count"], [tag(-3 * HOUR), "2.33", "9", "8"], [tag(-HOUR), String(KP_NOW()), "12", "8"]]);
  if (u.includes("solar_probabilities")) return json([{ date: tag(0).slice(0, 10), m_class_1_day: scen === "soleil" ? 55 : 15, x_class_1_day: scen === "soleil" ? 15 : 1 }]);
  if (u.includes("earthquake.usgs.gov")) return json({ type: "FeatureCollection", features: QUAKES });
  if (u.includes("seismicportal.eu")) return json({ type: "FeatureCollection", features: [] });
  return realFetch(url, ...rest);
};
const cards = {
  meteo: document.createElement("meteo-card"),
  ciel: document.createElement("meteo-ciel-card"),
  astro: document.createElement("meteo-astro-card"),
  air: document.createElement("meteo-air-card"),
  eclairs: document.createElement("meteo-eclairs-card"),
  seismes: document.createElement("meteo-seismes-card"),
  bolides: document.createElement("meteo-bolides-card"),
};
Object.values(cards).forEach((c) => host.appendChild(c));
function apply() {
  const t = theme;
  cards.meteo.setConfig({ theme: t, entities: [{ entity: "weather.ville_exemple", name: "Ville-Exemple" }, { entity: "weather.station_montagne", name: "Station-Montagne" }, { entity: "weather.ville_erable", name: "Ville-Érable (Canada)" }],
    forecasts: ["hourly", "daily"], hours: 8, days: 7, ...(photos ? { moon_image: PHOTOS().moon_image } : {}) });
  cards.ciel.setConfig({ theme: t, windy, temperatures: [{ name: "Salon", entity: "sensor.salon_temperature", humidity: "sensor.salon_humidity" },
    { name: "Jardin", entity: "sensor.jardin_temperature", humidity: "sensor.jardin_humidity", icon: "mdi:tree-outline" }] });
  cards.astro.setConfig({ theme: t, ...PHOTOS() });
  cards.air.setConfig({ theme: t });
  cards.eclairs.setConfig({ theme: t, month_counter: "sensor.eclairs_du_mois" });
  cards.seismes.setConfig({ theme: t });
  cards.bolides.setConfig({ theme: t });
  const h = hassFor();
  Object.values(cards).forEach((c) => { c.hass = h; });
  listeners.forEach((f) => f());
}
apply();
document.querySelector(".bar").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.theme) {
    theme = b.dataset.theme === "auto-light" ? "auto" : b.dataset.theme;
    document.body.classList.toggle("light", b.dataset.theme === "auto-light");
    document.querySelectorAll("[data-theme]").forEach((x) => x.classList.toggle("on", x === b));
  }
  if (b.dataset.act === "phone") { document.body.classList.toggle("phone"); b.classList.toggle("on"); }
  else if (b.dataset.act === "windy") { windy = !windy; b.classList.toggle("on", windy); }
  else if (b.dataset.act === "photos") { photos = !photos; b.classList.toggle("on", photos); }
  else if (b.dataset.act) { scen = b.dataset.act; document.querySelectorAll("[data-act=pluie],[data-act=soleil]").forEach((x) => x.classList.toggle("on", x === b)); }
  apply();
});
</script>
